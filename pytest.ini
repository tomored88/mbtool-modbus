[pytest]
testpaths = tests
# capture=sys, not the default capture=fd: redirecting the process's real stdout/stderr handles makes Tcl's
# start-up on Windows intermittently fail ("couldn't read file .../init.tcl: No error") when a test creates
# a Tk window. Measured: 3 of 9 runs failed with fd capture, 0 of 9 with sys capture or none.
addopts = --capture=sys
